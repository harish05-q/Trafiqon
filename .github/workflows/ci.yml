name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: trafiqon
          POSTGRES_PASSWORD: trafiqon
          POSTGRES_DB: trafiqon
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U trafiqon -d trafiqon"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      # Integration tests drop/recreate this database's schema (it is created if missing).
      TRAFIQON_TEST_DATABASE_URL: postgresql+psycopg://trafiqon:trafiqon@localhost:5432/trafiqon_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.6"
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Tests (unit + integration on real PostgreSQL)
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint (ESLint + Prettier)
        run: npm run lint
      - name: Unit tests (Vitest)
        run: npm test
      - name: Production build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: trafiqon
          POSTGRES_PASSWORD: trafiqon
          POSTGRES_DB: trafiqon
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U trafiqon -d trafiqon"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.6"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --frozen
        working-directory: backend
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Playwright workflows 1-6 (real API, worker, database, production build)
        run: npx playwright test
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results
          path: frontend/test-results
          retention-days: 7

  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build the Compose images
        run: docker compose build
