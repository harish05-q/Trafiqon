# Local stack. M4: database only; api/worker/web services are added in M8.
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: trafiqon
      POSTGRES_PASSWORD: trafiqon
      POSTGRES_DB: trafiqon
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trafiqon -d trafiqon"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
