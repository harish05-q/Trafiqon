[project]
name = "trafiqon"
version = "0.1.0"
description = "TRAFIQON: directed CVRP routing, optimization and simulation workbench (core + API)"
readme = "README.md"
authors = [
    { name = "Harish Pal", email = "webdevharry63@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "numpy>=2.1",
    "ortools>=9.15.6755",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "networkx>=3.7",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:builtin type .* has no __module__ attribute:DeprecationWarning"]
