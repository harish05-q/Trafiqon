<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img" aria-labelledby="t d">
  <title id="t">Trafiqon architecture</title>
  <desc id="d">Browser talks to Next.js web on port 3000, which calls the FastAPI service on port 8000 over HTTP and SSE. The API uses PostgreSQL over SQL. Worker processes claim queued runs from PostgreSQL with SKIP LOCKED. API and worker share a pure-Python core library.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#131d3f"/>
    </linearGradient>
    <linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#6366f1"/></linearGradient>
    <linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#059669"/></linearGradient>
    <linearGradient id="c" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f472b6"/><stop offset="1" stop-color="#a855f7"/></linearGradient>
    <linearGradient id="d2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#f97316"/></linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#a5b4fc"/>
    </marker>
    <style>
      .box{stroke-width:0}
      .t1{font:700 17px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#fff}
      .t2{font:13px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#e0e7ff}
      .lbl{font:600 12px ui-monospace,Menlo,Consolas,monospace;fill:#a5b4fc}
      .flow{fill:none;stroke:#a5b4fc;stroke-width:2.5;stroke-dasharray:7 7;animation:dash 1.2s linear infinite}
      .rev{animation-direction:reverse}
      @keyframes dash{to{stroke-dashoffset:-28}}
      .float{animation:float 4s ease-in-out infinite}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
    </style>
  </defs>
  <rect width="900" height="440" rx="18" fill="url(#bg)"/>

  <text x="450" y="38" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#c7d2fe">How the pieces fit</text>

  <!-- Browser -->
  <g>
    <rect x="30" y="100" width="170" height="90" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="115" y="140" text-anchor="middle" class="t1">Browser</text>
    <text x="115" y="164" text-anchor="middle" class="t2">Command Center · Lab</text>
  </g>
  <!-- Web -->
  <g class="float">
    <rect x="260" y="100" width="170" height="90" rx="14" fill="url(#a)"/>
    <text x="345" y="136" text-anchor="middle" class="t1">Next.js web</text>
    <text x="345" y="160" text-anchor="middle" class="t2">:3000</text>
  </g>
  <!-- API -->
  <g class="float" style="animation-delay:.5s">
    <rect x="490" y="100" width="170" height="90" rx="14" fill="url(#b)"/>
    <text x="575" y="136" text-anchor="middle" class="t1">FastAPI</text>
    <text x="575" y="160" text-anchor="middle" class="t2">:8000</text>
  </g>
  <!-- Postgres -->
  <g class="float" style="animation-delay:1s">
    <rect x="720" y="100" width="150" height="90" rx="14" fill="url(#c)"/>
    <text x="795" y="136" text-anchor="middle" class="t1">PostgreSQL</text>
    <text x="795" y="160" text-anchor="middle" class="t2">runs · scenarios</text>
  </g>

  <!-- Core -->
  <g>
    <rect x="450" y="300" width="250" height="100" rx="14" fill="#1e293b" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="575" y="332" text-anchor="middle" class="t1">core (pure Python)</text>
    <text x="575" y="356" text-anchor="middle" class="t2">domain · routing · optimization</text>
    <text x="575" y="376" text-anchor="middle" class="t2">simulation · experiments</text>
  </g>
  <!-- Worker -->
  <g class="float" style="animation-delay:1.5s">
    <rect x="740" y="310" width="130" height="80" rx="14" fill="url(#d2)"/>
    <text x="805" y="344" text-anchor="middle" class="t1">Worker(s)</text>
    <text x="805" y="366" text-anchor="middle" class="t2">solver runs</text>
  </g>

  <!-- flows -->
  <path class="flow" d="M200 145H258" marker-end="url(#arr)"/>
  <path class="flow" d="M430 145H488" marker-end="url(#arr)"/>
  <text x="460" y="135" text-anchor="middle" class="lbl">HTTP/SSE</text>
  <path class="flow" d="M660 145H718" marker-end="url(#arr)"/>
  <text x="690" y="135" text-anchor="middle" class="lbl">SQL</text>

  <!-- API imports core -->
  <path class="flow" d="M575 190V298" marker-end="url(#arr)"/>
  <text x="583" y="250" class="lbl">imports</text>
  <!-- worker uses core -->
  <path class="flow rev" d="M740 350H702" marker-end="url(#arr)"/>
  <!-- worker polls queue in db -->
  <path class="flow rev" d="M805 308V192" marker-end="url(#arr)"/>
  <text x="813" y="255" class="lbl">FOR UPDATE</text>
  <text x="813" y="271" class="lbl">SKIP LOCKED</text>

  <text x="30" y="420" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#94a3b8">The job queue is the optimization_runs table. Celery + Redis is deferred (STATUS.md, D1).</text>
</svg>
